name: CI

on:
  pull_request:
  push:
    branches: [ main ]

# Ruby comes from .ruby-version, pnpm from package.json "packageManager",
# Node 24 matches devenv.nix (local setup).

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      RUBOCOP_CACHE_ROOT: tmp/rubocop
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Prepare RuboCop cache
        uses: actions/cache@v6
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('.ruby-version', '**/.rubocop.yml', 'Gemfile.lock') }}
        with:
          path: ${{ env.RUBOCOP_CACHE_ROOT }}
          key: rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-

      - name: RuboCop
        run: bundle exec rubocop -f github

      - name: Gem audit
        run: bundle exec bundler-audit check --update

      - name: Brakeman (demo app + gem)
        run: bundle exec brakeman --no-pager -q -p demo --add-engines-path ..

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Compiled CSS is up to date
        run: pnpm build:css:check

      - name: JavaScript tests
        run: pnpm test

      - name: Ruby tests
        run: bundle exec rake test

  preview-quality-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: GCWeb parity, accessibility and visual regression
        run: pnpm preview:check

      # Linux baselines are created on first run; download them from this
      # artifact and commit them under test/visual_baselines/linux.
      - name: Upload screenshots, diffs and server log
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: preview-quality-artifacts
          path: |
            tmp/visual-current
            tmp/visual-diffs
            test/visual_baselines/linux
            demo/tmp/preview-server.log
          if-no-files-found: ignore
