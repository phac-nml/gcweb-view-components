en:
  gcweb:
    featured_link:
      heading: "Spotlight on"
    # wet-boew's overlay close buttons on GCWeb v20.0.1 (i18n close, colon,
    # esc-key and overlay-close).
    overlay:
      close: "Close"
      overlay: "overlay"
      close_title: "Close: %{title} (escape key)"
    # Strings wet-boew's form validation uses on GCWeb v20.0.1 (common/form).
    form:
      required: "(required)"
      error_prefix: "Error: "
      error_prefix_numbered: "Error\u00A0%{number}: "
      select_prompt: "Make your selection"
      error_summary:
        heading:
          one: "The form could not be submitted because 1 error was found."
          other: "The form could not be submitted because %{count} errors were found."
        separator: " - "
      # jquery.validate's messages on GCWeb v20.0.1, used by the
      # gcweb--form-validation controller (Constraint Validation API).
      validation:
        required: "This field is required."
        email: "Please enter a valid email address."
        url: "Please enter a valid URL."
        number: "Please enter a valid number."
        date: "Please enter a valid date."
        minlength: "Please enter at least %{count} characters."
        maxlength: "Please enter no more than %{count} characters."
        min: "Please enter a value greater than or equal to %{count}."
        max: "Please enter a value less than or equal to %{count}."
        step: "Please enter a multiple of %{count}."
        pattern: "Invalid format."
