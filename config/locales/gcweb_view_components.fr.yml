fr:
  gcweb:
    # The page header (GCWeb v20.0.1 sites/header, sites/skiplinks,
    # sites/language and sites/search).
    header:
      skip_to_content: "Passer au contenu principal"
      skip_to_about: "Passer à « À propos de ce site »"
      language_selection: "Sélection de la langue"
      search: "Recherche"
      search_canada_ca: "Rechercher dans Canada.ca"
    # The breadcrumb trail's hidden heading (sites/breadcrumbs).
    breadcrumbs:
      title: "Vous êtes ici :"
    # Tableaux de données (wet-boew tables / wb-tables) : chaînes i18n de
    # wet-boew sur GCWeb v20.0.1 (sortAsc, sortDesc, filter, infoEntr,
    # infoEmpty, infoFilt, info1000 et emptyTbl).
    data_table:
      sort_asc: "%{column}\u00A0: activer pour tri ascendant"
      sort_desc: "%{column}\u00A0: activer pour tri descendant"
      filter: "Filtrer les articles"
      info: "Affiche %{first} à %{last} de %{total} entrées"
      info_empty: "Affiche 0 à 0 de 0 entrées"
      info_filtered: "(filtré de %{max} entrées totales)"
      thousands_delimiter: "\u00A0"
      empty: "Aucune donnée n'est disponible dans le tableau"
      length_html: "Afficher %{menu} entrées"
      length_apply: "Appliquer"
      pagination: "Pagination\u00A0: %{caption}"
    # Pagination (chaînes i18n prv, nxt et page de wet-boew).
    pagination:
      label: "Pagination"
      previous: "Précédent"
      next: "Suivant"
      page: "Aller à: Page"
    featured_link:
      heading: "Pleins feux sur"
    # The services and information heading (GCWeb components/gc-srvinfo).
    services_and_information:
      title: "Services et renseignements"
    # The most requested heading (GCWeb components/gc-most-requested).
    most_requested:
      title: "En demande"
    # The in-page table of contents heading (GCWeb components/gc-toc).
    table_of_contents:
      title: "Sur cette page"
    # wet-boew's overlay close buttons on GCWeb v20.0.1 (i18n close, colon,
    # esc-key and overlay-close).
    overlay:
      close: "Fermer"
      overlay: "la fenêtre superposée"
      close_title: "Fermer\u00A0: %{title} (touche d'échappement)"
    # Strings wet-boew's form validation uses on GCWeb v20.0.1 (common/form).
    form:
      required: "(obligatoire)"
      error_prefix: "Erreur\u00A0: "
      error_prefix_numbered: "Erreur\u00A0%{number}\u00A0: "
      select_prompt: "Faites votre choix"
      error_summary:
        heading:
          one: "Le formulaire n'a pu être soumis car 1 erreur a été trouvée."
          other: "Le formulaire n'a pu être soumis car %{count} erreurs ont été trouvées."
        separator: " - "
      # Messages de jquery.validate sur GCWeb v20.0.1, utilisés par le
      # contrôleur gcweb--form-validation (API Constraint Validation).
      validation:
        required: "Ce champ est obligatoire."
        email: "Veuillez fournir une adresse électronique valide."
        url: "Veuillez fournir une adresse URL valide."
        number: "Veuillez fournir un numéro valide."
        date: "Veuillez fournir une date valide."
        minlength: "Veuillez fournir au moins %{count} caractères."
        maxlength: "Veuillez fournir au plus %{count} caractères."
        min: "Veuillez fournir une valeur supérieure ou égale à %{count}."
        max: "Veuillez fournir une valeur inférieure ou égale à %{count}."
        step: "Veuillez fournir une valeur multiple de %{count}."
        pattern: "Format non valide."
